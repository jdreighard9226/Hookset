<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Signup Page</title>
</head>
<body>
<center><h1>Signup</h1></center>
<form action="#" th:action="@{/signup}" th:object="${signupForm}" method="post">
    <span th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}">Global error</span><br/>  <!-- Add this line -->
    <input type="text" th:field="*{username}" placeholder="Username" required minlength="6"/>
    <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Username error</span><br/>
    <input type="password" th:field="*{password}" placeholder="Password" required minlength="6"/>
    <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password error</span><br/>

    <input type="password" th:field="*{confirmPassword}" placeholder="Confirm Password" required minlength="6"/>
    <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">Confirm Password error</span><br/>
    <button type="submit">Login</button>

    <div th:if="${param.error}">
        Invalid username or password.
    </div>
</form>
</body>
</html>
