<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      lang="en"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<!--/* the title and main below are inserted into layout.html, which adds the navbar, footer, and shared head */-->
<head>
    <meta charset="UTF-8"/>
    <title>Water Body Details</title>
</head>

<main>
    <div class="container py-5 mt-5">

        <div class="text-center">
            <h1 th:text="${waterBody.waterBodyName}"></h1>
            <h3 th:text="'Location: ' + ${waterBody.waterBodyState}"></h3>
            <p class="w-75 mx-auto" th:text="${waterBody.waterBodyDescription}"></p>
        </div>

        <div class="row justify-content-center">

            <h2 class="text-center" th:text="'Fish Species at ' + ${waterBody.waterBodyName}"></h2>

            <!--/* one card per species, two across on medium screens and up, one on phones */-->
            <div th:each="fish : ${fishes}" class="col-12 col-md-6 my-3 d-flex justify-content-center">
                <div class="card shadow-sm text-center fish-card-green">
                    <div class="card-body">
                        <img class="fish-image"
                             th:src="@{'/images/fish/' + ${fish.fishImage}}"
                             th:alt="${fish.fishSpecies}">
                        <h3 th:text="${fish.fishSpecies}"></h3>
                        <p th:text="'Family: ' + ${fish.fishFamily}"></p>
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center">
            <a th:href="@{/waterbodies}" class="primary-button d-inline-block mt-4">
                Return To Water Bodies
            </a>
        </div>

    </div>
</main>
</html>
